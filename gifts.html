  <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Balance Transfer</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#ff69b4,#ff1493,#db7093);min-height:100vh;overflow-x:hidden}.header{background:linear-gradient(135deg,rgba(255,105,180,.9),rgba(255,20,147,.9));padding:15px 20px;display:flex;align-items:center;gap:15px;box-shadow:0 2px 15px rgba(0,0,0,.2)}.back-btn{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:8px;transition:transform .3s}.back-btn:hover{transform:scale(1.1)}.header-title{color:#fff;font-size:20px;font-weight:700;text-shadow:2px 2px 4px rgba(0,0,0,.3)}.container{max-width:500px;margin:20px auto;padding:0 15px}.balance-card{background:linear-gradient(135deg,rgba(255,192,203,.9),rgba(255,182,193,.9));backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:25px;margin-bottom:25px;box-shadow:0 15px 40px rgba(255,20,147,.4)}.balance-card h2{color:#8b008b;font-size:22px;margin-bottom:20px;text-align:center;text-shadow:2px 2px 4px rgba(0,0,0,.3)}.balance-info{display:flex;gap:15px}.balance-item{background:linear-gradient(135deg,rgba(255,105,180,.3),rgba(255,182,193,.3));border:2px solid rgba(255,255,255,.4);border-radius:15px;padding:20px;flex:1;text-align:center;box-shadow:0 8px 25px rgba(255,20,147,.3);transition:all .3s}.balance-item:hover{transform:translateY(-5px)}.balance-item label{color:#8b008b;font-size:12px;display:block;margin-bottom:8px;font-weight:600}.balance-item span{color:#fff;font-size:18px;font-weight:800;text-shadow:1px 1px 3px rgba(0,0,0,.7)}.balance-item .status{font-size:10px;color:#fff;margin-top:5px;opacity:.8}.transfer-box{background:linear-gradient(135deg,rgba(255,192,203,.95),rgba(255,182,193,.95));backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);border-radius:15px;padding:25px;box-shadow:0 8px 30px rgba(255,20,147,.3);margin-bottom:25px}.transfer-row{display:flex;align-items:center;gap:10px;margin-bottom:15px}.input-group{flex:1;position:relative}.input-group label{display:block;color:#8b008b;font-size:12px;margin-bottom:6px;font-weight:600}.input-group input{width:100%;padding:12px;background:rgba(255,255,255,.8);border:2px solid rgba(255,105,180,.3);border-radius:10px;color:#8b008b;font-size:13px;transition:all .3s;outline:none}.input-group input:focus{border-color:#ff69b4;box-shadow:0 0 15px rgba(255,105,180,.3)}.user-info{position:absolute;top:100%;left:0;right:0;background:rgba(255,255,255,.95);border:1px solid #ff69b4;border-radius:8px;padding:8px;margin-top:2px;font-size:11px;color:#8b008b;display:none;z-index:100}.user-info.show{display:block}.user-info.found{border-color:#4CAF50;color:#2e7d32}.user-info.not-found{border-color:#f44336;color:#c62828}.icon-transfer{width:45px;height:45px;background:linear-gradient(135deg,rgba(255,105,180,.6),rgba(255,20,147,.8));border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.5);box-shadow:0 5px 20px rgba(255,105,180,.4);flex-shrink:0;animation:pulse 2s infinite}.icon-transfer svg{width:22px;height:22px;fill:#fff}.btn-submit{width:100%;padding:15px;background:linear-gradient(135deg,#ff1493,#ff69b4);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 25px rgba(255,20,147,.5);transition:all .3s}.btn-submit:hover{transform:translateY(-3px)}.gifts-log{background:linear-gradient(135deg,rgba(255,192,203,.95),rgba(255,182,193,.95));backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:25px;box-shadow:0 10px 35px rgba(255,20,147,.4)}.gifts-log h3{color:#8b008b;font-size:20px;margin-bottom:20px;text-align:center;text-shadow:2px 2px 4px rgba(0,0,0,.3)}.gift-item{background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,192,203,.4));border:2px solid rgba(255,105,180,.3);border-radius:15px;padding:20px;margin-bottom:15px;box-shadow:0 8px 25px rgba(255,20,147,.3);transition:all .3s}.gift-item:hover{transform:translateY(-3px)}.gift-item.opened{opacity:.6;background:linear-gradient(135deg,rgba(200,200,200,.4),rgba(180,180,180,.4))}.gift-header{display:flex;align-items:center;gap:15px;margin-bottom:15px}.gift-icon{width:50px;height:50px;background:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSt-2RcS87p5PgJz80kD9W7pzY0UcUqj-I2wA1ezBaupA&s=10') center/cover;border-radius:10px;box-shadow:0 5px 15px rgba(255,20,147,.4);animation:giftPulse 3s infinite}.gift-info{flex:1}.gift-sender{color:#8b008b;font-size:16px;font-weight:700;margin-bottom:5px}.gift-amount{color:#4CAF50;font-size:18px;font-weight:800}.gift-date{color:rgba(139,0,139,.8);font-size:11px}.open-gift-btn{width:100%;padding:12px;background:linear-gradient(135deg,#ff1493,#ff69b4);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(255,20,147,.4);transition:all .3s;margin-top:10px}.open-gift-btn:hover{transform:translateY(-2px)}.open-gift-btn:disabled{background:linear-gradient(135deg,#999,#777);cursor:not-allowed;transform:none}.gift-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,105,180,.8);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;visibility:hidden;transition:all .4s}.gift-modal.show{opacity:1;visibility:visible}.gift-opened{background:linear-gradient(135deg,rgba(255,192,203,.98),rgba(255,182,193,.98));border:3px solid #ff1493;border-radius:25px;padding:40px;text-align:center;box-shadow:0 20px 60px rgba(255,20,147,.7);transform:scale(0);transition:all .5s;position:relative;overflow:hidden}.gift-modal.show .gift-opened{transform:scale(1);animation:celebration 1s ease-out}.gift-opened::before{content:'🎉';font-size:100px;position:absolute;top:-20px;left:-20px;animation:sparkle 2s infinite}.gift-opened::after{content:'✨';font-size:80px;position:absolute;bottom:-10px;right:-10px;animation:sparkle 2s infinite reverse}.gift-opened h2{color:#8b008b;font-size:28px;margin-bottom:20px}.gift-opened .amount{color:#4CAF50;font-size:36px;font-weight:900;margin:20px 0}.close-modal{position:absolute;top:15px;right:20px;background:none;border:none;color:#8b008b;font-size:24px;cursor:pointer;font-weight:bold}.amount-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,105,180,.8);display:flex;align-items:center;justify-content:center;z-index:1500;opacity:0;visibility:hidden;transition:all .4s}.amount-modal.show{opacity:1;visibility:visible}.amount-input-box{background:linear-gradient(135deg,rgba(255,192,203,.98),rgba(255,182,193,.98));border:2px solid rgba(255,105,180,.4);border-radius:20px;padding:30px;text-align:center;box-shadow:0 15px 50px rgba(255,20,147,.5);transform:scale(0);transition:all .4s}.amount-modal.show .amount-input-box{transform:scale(1)}.amount-input-box h3{color:#8b008b;font-size:20px;margin-bottom:20px}.amount-input{width:100%;padding:15px;background:rgba(255,255,255,.8);border:2px solid rgba(255,105,180,.3);border-radius:10px;color:#8b008b;font-size:16px;text-align:center;margin-bottom:20px;outline:none}.amount-input:focus{border-color:#ff69b4}.amount-buttons{display:flex;gap:15px}.amount-btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .3s}.confirm-btn{background:linear-gradient(135deg,#4CAF50,#66BB6A);color:white}.cancel-btn{background:linear-gradient(135deg,#f44336,#ef5350);color:white}.amount-btn:hover{transform:translateY(-2px)}.success{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,rgba(255,192,203,.98),rgba(255,182,193,.98));border:2px solid rgba(255,105,180,.4);border-radius:15px;padding:30px 40px;text-align:center;box-shadow:0 15px 50px rgba(255,20,147,.5);z-index:1000;opacity:0;transition:all .4s}.success.show{transform:translate(-50%,-50%) scale(1);opacity:1}.success svg{width:50px;height:50px;fill:#ff1493;margin-bottom:10px}.success p{color:#8b008b;font-size:16px;font-weight:600}.no-gifts{text-align:center;color:#8b008b;font-size:16px;opacity:.7;padding:30px}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes giftPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes celebration{0%{transform:scale(0) rotate(0deg)}50%{transform:scale(1.1) rotate(10deg)}100%{transform:scale(1) rotate(0deg)}}@keyframes sparkle{0%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}100%{opacity:.5;transform:scale(1)}}@media(max-width:480px){.transfer-row{flex-direction:column;gap:15px}.icon-transfer{order:2}.balance-info{flex-direction:column;gap:10px}.container{padding:0 10px}.amount-buttons{flex-direction:column}}</style></head><body><div class="header"><button class="back-btn" onclick="window.history.back()">←</button><div class="header-title">💰 Balance Transfer</div></div><div class="container"><div class="balance-card"><h2>💰 Balance Card</h2><div class="balance-info"><div class="balance-item sendable"><label>💸 Sendable Balance</label><span id="sendableBalance">$0</span><div class="status">Available for Transfer</div></div><div class="balance-item non-sendable"><label>🔒 Non-Sendable Balance</label><span>$0</span><div class="status">Temporarily Frozen</div></div></div></div><div class="transfer-box"><div class="transfer-row"><div class="input-group"><label>Sender Username</label><input type="text" id="sender" placeholder="Enter sender username" required></div><div class="icon-transfer"><svg viewBox="0 0 24 24"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/></svg></div><div class="input-group"><label>Receiver Username</label><input type="text" id="receiver" placeholder="Enter receiver username" required><div class="user-info" id="receiverInfo"></div></div></div><button class="btn-submit" onclick="initiateTransfer()">Enter Your Friend's Username to Transfer Money</button></div><div class="gifts-log"><h3>🎁 Received Gifts Log</h3><div id="giftsContainer"><div class="no-gifts">Loading gifts...</div></div></div></div><div class="amount-modal" id="amountModal"><div class="amount-input-box"><h3>💰 Enter Amount to Send</h3><input type="number" class="amount-input" id="amountInput" placeholder="Enter amount in dollars" min="1"><div class="amount-buttons"><button class="amount-btn confirm-btn" onclick="confirmTransfer()">Confirm Send</button><button class="amount-btn cancel-btn" onclick="closeAmountModal()">Cancel</button></div></div></div><div class="gift-modal" id="giftModal"><div class="gift-opened"><button class="close-modal" onclick="closeGift()">×</button><h2 id="giftSender"></h2><div class="amount" id="giftAmount"></div><p>🎊 Congratulations! Your gift has been opened successfully! 🎊</p></div></div><div class="success" id="success"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg><p>Transfer completed successfully!</p></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import{getFirestore,doc,setDoc,getDoc,updateDoc,onSnapshot,collection,addDoc,query,where,orderBy,serverTimestamp,getDocs}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";const config={apiKey:"AIzaSyA-MK1RYmvpYJrTOBAQcxDqxhp-z_FOb1o",authDomain:"mzjsjjshs.firebaseapp.com",projectId:"mzjsjjshs",storageBucket:"mzjsjjshs.firebasestorage.app",messagingSenderId:"944370558426",appId:"1:944370558426:web:70d4ee772c487f48b58ce3"},app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);let currentUser=null,searchTimeout=null;signInAnonymously(auth);onAuthStateChanged(auth,async user=>{if(user){currentUser=user;console.log('Current user:',user.uid);await initUser(user.uid);listenToBalance(user.uid);await loadGifts(user.uid)}});async function initUser(uid){try{const userDoc=await getDoc(doc(db,'users',uid));if(!userDoc.exists()){await setDoc(doc(db,'users',uid),{balance:1000,createdAt:serverTimestamp()})}}catch(e){console.error("Error creating user:",e)}}function listenToBalance(uid){onSnapshot(doc(db,'users',uid),snapshot=>{if(snapshot.exists()){const balance=snapshot.data().balance||0;document.getElementById('sendableBalance').textContent='$'+balance}})}async function loadGifts(uid){console.log('Loading gifts for user:',uid);try{const giftsRef=collection(db,'gifts');const q=query(giftsRef,where('receiverId','==',uid));const snapshot=await getDocs(q);console.log('Number of gifts:',snapshot.size);const container=document.getElementById('giftsContainer');container.innerHTML='';if(snapshot.empty){container.innerHTML='<div class="no-gifts">No gifts received yet 🎁</div>';return}snapshot.forEach(doc=>{const data=doc.data();const id=doc.id;console.log('Gift data:',data);const isOpened=data.opened||false;const div=document.createElement('div');div.className='gift-item'+(isOpened?' opened':'');const senderName=data.senderUsername||data.senderId||'Unknown';const amount=data.amount||0;const timestamp=data.timestamp;let dateText='Date not specified';if(timestamp&&timestamp.toDate){dateText=formatTime(timestamp.toDate())}else if(timestamp){dateText=formatTime(new Date(timestamp))}div.innerHTML=`<div class="gift-header"><div class="gift-icon"></div><div class="gift-info"><div class="gift-sender">👑 ${senderName}</div><div class="gift-amount">+ $${amount}</div><div class="gift-date">${dateText}</div></div></div><button class="open-gift-btn" ${isOpened?'disabled':''} onclick="${isOpened?'':'openGift(\''+id+'\',\''+encodeURIComponent(senderName)+'\',\''+amount+'\')'}">${isOpened?'🎁 Gift Opened':'🎉 Open Gift'}</button>`;container.appendChild(div)});listenToNewGifts(uid)}catch(error){console.error('Error loading gifts:',error);const container=document.getElementById('giftsContainer');container.innerHTML='<div class="no-gifts">Error loading gifts</div>'}}function listenToNewGifts(uid){const giftsRef=collection(db,'gifts');const q=query(giftsRef,where('receiverId','==',uid));onSnapshot(q,snapshot=>{console.log('Gift update - count:',snapshot.size);const container=document.getElementById('giftsContainer');container.innerHTML='';if(snapshot.empty){container.innerHTML='<div class="no-gifts">No gifts received yet 🎁</div>';return}const gifts=[];snapshot.forEach(doc=>{gifts.push({id:doc.id,...doc.data()})});gifts.sort((a,b)=>{if(!a.timestamp)return 1;if(!b.timestamp)return -1;const aTime=a.timestamp.toDate?a.timestamp.toDate():new Date(a.timestamp);const bTime=b.timestamp.toDate?b.timestamp.toDate():new Date(b.timestamp);return bTime-aTime});gifts.forEach(gift=>{const isOpened=gift.opened||false;const div=document.createElement('div');div.className='gift-item'+(isOpened?' opened':'');const senderName=gift.senderUsername||gift.senderId||'Unknown';const amount=gift.amount||0;let dateText='Date not specified';if(gift.timestamp){if(gift.timestamp.toDate){dateText=formatTime(gift.timestamp.toDate())}else{dateText=formatTime(new Date(gift.timestamp))}}div.innerHTML=`<div class="gift-header"><div class="gift-icon"></div><div class="gift-info"><div class="gift-sender">👑 ${senderName}</div><div class="gift-amount">+ $${amount}</div><div class="gift-date">${dateText}</div></div></div><button class="open-gift-btn" ${isOpened?'disabled':''} onclick="${isOpened?'':'openGift(\''+gift.id+'\',\''+encodeURIComponent(senderName)+'\',\''+amount+'\')'}">${isOpened?'🎁 Gift Opened':'🎉 Open Gift'}</button>`;container.appendChild(div)})})}function formatTime(date){if(!date)return'Date not specified';try{const now=new Date();const diff=now-date;const mins=Math.floor(diff/60000);const hours=Math.floor(diff/3600000);const days=Math.floor(diff/86400000);if(mins<1)return'Now';if(mins<60)return`${mins} min ago`;if(hours<24)return`${hours}h ago`;if(days===1)return'Yesterday';if(days<7)return`${days} days ago`;return date.toLocaleDateString('en-US')}catch(e){return'Invalid date'}}async function checkUser(username){const info=document.getElementById('receiverInfo');if(!username.trim()){info.classList.remove('show');return}try{const usersRef=collection(db,'users');const q=query(usersRef,where('username','==',username));const snapshot=await getDocs(q);if(!snapshot.empty){const userData=snapshot.docs[0].data();info.innerHTML=`✅ User found: ${userData.displayName||username}`;info.classList.add('show','found');info.classList.remove('not-found')}else{info.innerHTML='❌ User not found';info.classList.add('show','not-found');info.classList.remove('found')}}catch{info.innerHTML='❌ Error checking user';info.classList.add('show','not-found');info.classList.remove('found')}}document.getElementById('receiver').addEventListener('input',e=>{clearTimeout(searchTimeout);searchTimeout=setTimeout(()=>checkUser(e.target.value),500)});window.initiateTransfer=function(){const sender=document.getElementById('sender').value.trim(),receiver=document.getElementById('receiver').value.trim();if(!sender){alert('Please enter sender username');return}if(!receiver){alert('Please enter receiver username');return}if(sender===receiver){alert('Cannot transfer to the same user');return}if(!currentUser){alert('Please wait a moment...');return}document.getElementById('amountModal').classList.add('show')};window.confirmTransfer=async function(){const amount=parseFloat(document.getElementById('amountInput').value),senderUsername=document.getElementById('sender').value.trim(),receiverUsername=document.getElementById('receiver').value.trim();if(!amount||amount<=0){alert('Please enter a valid amount');return}try{const userDoc=await getDoc(doc(db,'users',currentUser.uid)),userBalance=userDoc.data()?.balance||0;if(userBalance<amount){alert('Insufficient balance');return}const usersRef=collection(db,'users');const q=query(usersRef,where('username','==',receiverUsername));const snapshot=await getDocs(q);let receiverId;if(snapshot.empty){const newUserRef=doc(db,'users');await setDoc(newUserRef,{balance:0,username:receiverUsername,createdAt:serverTimestamp()});receiverId=newUserRef.id}else{receiverId=snapshot.docs[0].id}await updateDoc(doc(db,'users',currentUser.uid),{balance:userBalance-amount,username:senderUsername});await addDoc(collection(db,'gifts'),{senderId:currentUser.uid,senderUsername:senderUsername,receiverId:receiverId,receiverUsername:receiverUsername,amount:amount,timestamp:serverTimestamp(),opened:false});console.log('Gift sent successfully');closeAmountModal();showSuccess();setTimeout(()=>{document.getElementById('success').classList.remove('show');document.getElementById('sender').value='';document.getElementById('receiver').value='';document.getElementById('amountInput').value='';document.getElementById('receiverInfo').classList.remove('show')},3000)}catch(e){console.error("Transfer error:",e);alert('Transfer failed')}};window.closeAmountModal=function(){document.getElementById('amountModal').classList.remove('show')};window.openGift=async function(giftId,senderName,amount){try{const giftDoc=await getDoc(doc(db,'gifts',giftId));if(giftDoc.exists()&&!giftDoc.data().opened){const userDoc=await getDoc(doc(db,'users',currentUser.uid)),currentBalance=userDoc.data()?.balance||0;await updateDoc(doc(db,'users',currentUser.uid),{balance:currentBalance+parseFloat(amount)});await updateDoc(doc(db,'gifts',giftId),{opened:true});document.getElementById('giftSender').textContent='🎁 Gift from '+decodeURIComponent(senderName);document.getElementById('giftAmount').textContent='$'+amount;document.getElementById('giftModal').classList.add('show');console.log('Gift opened successfully')}}catch(e){console.error("Error opening gift:",e);alert('Failed to open gift')}};window.closeGift=function(){document.getElementById('giftModal').classList.remove('show')};function showSuccess(){document.getElementById('success').classList.add('show')}</script></body></html>
