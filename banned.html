<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شموع فوركس - فريم دقيقة (بيانات حقيقية)</title>
    <!-- استيراد مكتبة TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <!-- استيراد مكتبة SignalR للبث اللحظي -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e222d;
            color: #d1d4dc;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #status-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 20px;
            background-color: #2a2e39;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        #connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef5350;
            display: inline-block;
        }
        .status-dot.connected {
            background-color: #26a69a;
        }
        #price-display {
            font-size: 18px;
            font-weight: bold;
            color: #26a69a;
            font-variant-numeric: tabular-nums;
        }
        #chart-container {
            width: 100%;
            max-width: 1200px;
            height: 600px;
            background-color: #131722;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .note {
            margin-top: 10px;
            font-size: 12px;
            color: #787b86;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="status-bar">
        <div id="connection-status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">جاري الاتصال...</span>
        </div>
        <div>
            EUR/USD (فريم 1 دقيقة) — السعر الحالي: 
            <span id="price-display">--</span>
        </div>
    </div>

    <div id="chart-container"></div>
    
    <div class="note">
        البيانات مصدرها MetaTrader 5 عبر biquote.io — السعر المعروض هو سعر الـ mid الحقيقي دون تعديل.
    </div>

    <script>
        (function() {
            const SYMBOL = 'EURUSD'; // يمكنك تغييره إلى XAUUSD أو غيره
            const INTERVAL = '1m';    // فريم الدقيقة الواحدة
            const CONTAINER = document.getElementById('chart-container');
            const PRICE_DISPLAY = document.getElementById('price-display');
            const STATUS_DOT = document.getElementById('status-dot');
            const STATUS_TEXT = document.getElementById('status-text');

            // 1. تهيئة الرسم البياني
            const chart = LightweightCharts.createChart(CONTAINER, {
                width: CONTAINER.clientWidth,
                height: 600,
                layout: {
                    background: { type: 'solid', color: '#131722' },
                    textColor: '#d1d4dc',
                },
                grid: {
                    vertLines: { color: '#2a2e39' },
                    horzLines: { color: '#2a2e39' },
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                    borderColor: '#2a2e39',
                },
                rightPriceScale: {
                    borderColor: '#2a2e39',
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
            });

            // 2. إضافة سلسلة الشموع
            const candleSeries = chart.addCandlestickSeries({
                upColor: '#26a69a',
                downColor: '#ef5350',
                borderVisible: false,
                wickUpColor: '#26a69a',
                wickDownColor: '#ef5350',
            });

            // متغير لتخزين آخر شمعة مفتوحة
            let currentBar = null;

            // 3. دالة تحديث السعر اللحظي بناءً على tick الجديد
            function updatePriceAndBar(midPrice, timestamp) {
                // تحديث عرض السعر
                PRICE_DISPLAY.textContent = midPrice.toFixed(5);

                // تحويل الطابع الزمني إلى ثوانٍ (TradingView يستخدم Unix timestamp بالثواني)
                // biquote قد يعيد الوقت بصيغة ISO أو milliseconds، نتعامل معه بحذر
                const now = Math.floor(Date.now() / 1000);
                const minuteStart = Math.floor(now / 60) * 60; // بداية الدقيقة الحالية

                if (!currentBar || currentBar.time < minuteStart) {
                    // بدء شمعة جديدة (دقيقة جديدة)
                    if (currentBar) {
                        // الشمعة السابقة اكتملت، نتركها كما هي (إغلاق حقيقي)
                        // لا نقوم بتعديلها بعد الآن
                    }
                    
                    // إنشاء شمعة جديدة بناءً على السعر الحالي
                    currentBar = {
                        time: minuteStart,
                        open: midPrice,
                        high: midPrice,
                        low: midPrice,
                        close: midPrice,
                    };
                    candleSeries.update(currentBar);
                } else {
                    // تحديث الشمعة الحالية (نفس الدقيقة)
                    currentBar.high = Math.max(currentBar.high, midPrice);
                    currentBar.low = Math.min(currentBar.low, midPrice);
                    currentBar.close = midPrice;
                    candleSeries.update(currentBar);
                }
            }

            // 4. جلب الشموع التاريخية (فريم 1 دقيقة) لتهيئة الرسم
            async function loadHistoricalBars() {
                try {
                    const url = `https://biquote.io/api/${SYMBOL}/ohlc?interval=${INTERVAL}&limit=200`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('فشل جلب البيانات التاريخية');
                    
                    const data = await response.json();
                    // biquote يعيد البيانات من الأحدث إلى الأقدم، نعكسها
                    // وأيضاً نتجاهل الشمعة المفتوحة (isOpen: true) لأننا سنبنيها لحظياً
                    const closedBars = data.bars
                        .filter(bar => !bar.isOpen)
                        .map(bar => ({
                            time: Math.floor(new Date(bar.openTime).getTime() / 1000),
                            open: bar.open,
                            high: bar.high,
                            low: bar.low,
                            close: bar.close,
                        }))
                        .sort((a, b) => a.time - b.time); // ترتيب تصاعدي

                    candleSeries.setData(closedBars);
                    
                    // بعد تحميل التاريخ، نبدأ الشمعة الحالية بالسعر الأخير
                    if (closedBars.length > 0) {
                        const lastClose = closedBars[closedBars.length - 1].close;
                        const now = Math.floor(Date.now() / 1000);
                        const minuteStart = Math.floor(now / 60) * 60;
                        
                        // إذا كانت آخر شمعة تاريخية هي نفس دقيقة الآن، نستخدمها كأساس
                        // وإلا ننشئ شمعة جديدة
                        if (closedBars[closedBars.length - 1].time === minuteStart) {
                            // نادراً ما يحدث، لكن نتعامل معه
                            currentBar = {
                                time: minuteStart,
                                open: lastClose,
                                high: lastClose,
                                low: lastClose,
                                close: lastClose,
                            };
                        } else {
                            currentBar = {
                                time: minuteStart,
                                open: lastClose,
                                high: lastClose,
                                low: lastClose,
                                close: lastClose,
                            };
                        }
                        candleSeries.update(currentBar);
                        PRICE_DISPLAY.textContent = lastClose.toFixed(5);
                    }
                } catch (error) {
                    console.error('خطأ في تحميل التاريخ:', error);
                    STATUS_TEXT.textContent = 'خطأ في تحميل البيانات التاريخية';
                }
            }

            // 5. الاتصال ببث SignalR للتحديثات اللحظية
            async function connectSignalR() {
                const connection = new signalR.HubConnectionBuilder()
                    .withUrl('https://biquote.io/hubs/tick')
                    .withAutomaticReconnect()
                    .build();

                // استقبال التيك الجديد
                connection.on('ReceiveTick', (tick) => {
                    // tick.symbol، tick.mid، tick.time (قد يكون هناك)
                    // نستخدم mid كسعر حقيقي
                    if (tick && tick.symbol === SYMBOL && tick.mid) {
                        updatePriceAndBar(tick.mid);
                    }
                });

                // أحداث الاتصال
                connection.onreconnecting(() => {
                    STATUS_DOT.classList.remove('connected');
                    STATUS_TEXT.textContent = 'جاري إعادة الاتصال...';
                });

                connection.onreconnected(() => {
                    STATUS_DOT.classList.add('connected');
                    STATUS_TEXT.textContent = 'متصل (بث لحظي)';
                    connection.invoke('Subscribe', [SYMBOL]).catch(console.error);
                });

                connection.onclose(() => {
                    STATUS_DOT.classList.remove('connected');
                    STATUS_TEXT.textContent = 'انقطع الاتصال';
                });

                try {
                    await connection.start();
                    STATUS_DOT.classList.add('connected');
                    STATUS_TEXT.textContent = 'متصل (بث لحظي)';
                    // الاشتراك في الرمز
                    await connection.invoke('Subscribe', [SYMBOL]);
                } catch (err) {
                    console.error('فشل الاتصال بـ SignalR:', err);
                    STATUS_TEXT.textContent = 'فشل الاتصال بالبث';
                    // في حالة الفشل، يمكننا الاعتماد على polling كخطة بديلة
                    startPollingFallback();
                }
            }

            // خطة بديلة: استقصاء دوري في حال فشل WebSocket
            let pollingInterval;
            function startPollingFallback() {
                if (pollingInterval) clearInterval(pollingInterval);
                pollingInterval = setInterval(async () => {
                    try {
                        const res = await fetch(`https://biquote.io/api/${SYMBOL}`);
                        const tick = await res.json();
                        if (tick && tick.mid) {
                            updatePriceAndBar(tick.mid);
                        }
                    } catch (e) {
                        console.error('فشل الاستقصاء:', e);
                    }
                }, 2000); // كل ثانيتين
            }

            // 6. بدء التشغيل
            loadHistoricalBars().then(() => {
                connectSignalR();
            });

            // تعديل الحجم عند تغيير النافذة
            window.addEventListener('resize', () => {
                chart.applyOptions({ width: CONTAINER.clientWidth });
            });

            // تنظيف عند إغلاق الصفحة
            window.addEventListener('beforeunload', () => {
                if (pollingInterval) clearInterval(pollingInterval);
            });
        })();
    </script>
</body>
</html>
